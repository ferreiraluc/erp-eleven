databases:
  - name: erp-eleven-db
    databaseName: eleven

services:
  # Backend API Service
  - type: web
    runtime: python
    name: erp-eleven-backend
    autoDeployTrigger: checksPass
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-eleven-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: LOG_LEVEL
        value: INFO

  # Frontend Static Site
  - type: web
    runtime: static
    name: erp-eleven-frontend
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm ci --include=dev && npm run build
    staticPublishPath: ./frontend/dist
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://erp-eleven-backend.onrender.com
