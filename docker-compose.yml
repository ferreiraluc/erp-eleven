# Optional LOCAL stack. Restore a sanitized database before starting the API.
# This does not provision or connect to the Render production services.
services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eleven
      SECRET_KEY: local-development-only-change-before-sharing
      TIMEZONE: America/Sao_Paulo
      ASSISTANT_ENABLED: "false"
      SUPERFRETE_SANDBOX: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eleven
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eleven"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
