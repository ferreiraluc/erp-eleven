name: Validate ERP Eleven
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: test_only_local
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ACCESS_TEST_DATABASE_URL: postgresql://erp_test:test_only_local@localhost:5432/erp_test
      PYTHONPATH: backend
      DATABASE_URL: sqlite://
      ASSISTANT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run type-check
      - run: npm run build
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit==2.10.1
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt --progress-spinner off
  print-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows agent configuration without printing
        shell: powershell
        run: ./tools/eleven-print-agent/tests/Configuracao.Tests.ps1
